<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queue（佇列）</title><style>body{font-family:system-ui,sans-serif;background:#fafafa;padding:20px;color:#222}.app{max-width:520px;margin:auto;background:white;padding:22px;border:1px solid #ddd;border-radius:14px}h2{margin-top:0}p{color:#666}input{width:95px;padding:9px;border:1px solid #ccc;border-radius:7px}button{padding:10px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer;margin:3px}.items{display:flex;gap:8px;min-height:65px;align-items:center;background:#f1f5f9;padding:12px;border-radius:9px;flex-wrap:wrap}.item{padding:14px;background:#dbeafe;border:2px solid #60a5fa;border-radius:7px}.next{background:#fef3c7;border-color:#f59e0b}.hint{font-size:13px;margin-top:12px}</style></head><body><main class="app"><h2>Queue（佇列）</h2><p>FIFO：先進先出</p><input id="num" type="number" placeholder="輸入數字"><button onclick="add()">Enqueue</button><button onclick="take()">Dequeue</button><button onclick="peek()">Peek</button><button onclick="reset()">重設</button><div class="items" id="items"></div><p class="hint">黃色代表下一個會被取出的元素；由左到右是加入順序。</p><p id="msg" aria-live="polite"></p></main><script>let a=[10,20,30];const mode='queue';const el=document.getElementById('items'),msg=document.getElementById('msg');function idx(){if(!a.length)return -1;if(mode==='stack')return a.length-1;if(mode==='queue')return 0;return a.indexOf(Math.max(...a))}function draw(){el.replaceChildren();let k=idx();a.forEach((v,i)=>{let d=document.createElement('div');d.className='item'+(i===k?' next':'');d.textContent=v;el.append(d)});if(!a.length)el.textContent='（空）'}function add(){let inp=document.getElementById('num');if(inp.value.trim()===''){msg.textContent='請輸入數字';return}a.push(Number(inp.value));msg.textContent='加入 '+inp.value;inp.value='';draw()}function take(){let k=idx();if(k<0){msg.textContent='目前是空的';return}msg.textContent='取出 '+a.splice(k,1)[0];draw()}function peek(){let k=idx();msg.textContent=k<0?'目前是空的':'Peek：'+a[k]+'（不移除）'}function reset(){a=[10,20,30];msg.textContent='已重設';draw()}document.getElementById('num').addEventListener('keydown',e=>{if(e.key==='Enter')add()});draw();</script></body></html>
